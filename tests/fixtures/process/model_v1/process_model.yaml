meta: {doc: process_v1.pdf, doc_version: "Rev 1", model_version: 1, updated: 2026-11-24}
processes:
  - id: SP-1
    name: Payment Process
    source: {doc: process_v1.pdf, pages: [1], ids: [SP-1]}
    actors: [user, system, coordinator]
    steps:
      - id: SP-1.1
        actor: user
        action: "creates the payment request"
        outputs: [payment request]
        next: [SP-1.2]
        source: {page: 1, ids: [SP-1.1], quote: "The user creates a payment request"}
      - id: SP-1.2
        actor: system
        action: "validates the amount in €, checks the fields, forwards the request to the coordinator"
        inputs: [payment request]
        next: [SP-1.3]
        on_exception: [{when: "amount mismatch", goto: SP-1.X1}]
        rules: [R-002]
        source: {page: 1, ids: [SP-1.2], quote: "The system validates the amount in €"}
      - id: SP-1.3
        actor: coordinator
        action: "approves the payment"
        duration: {value: 2, unit: days, param: P-approval}
        next: [SP-1.4]
        source: {page: 1, ids: [SP-1.3], quote: "The coordinator approves the payment within 2 days"}
      - id: SP-1.4
        actor: system
        action: "generates the receipt"
        outputs: [receipt]
        preconditions: ["SP-1.3 approval given"]
        next: [SP-1.5, SP-2.1]
        source: {page: 1, ids: [SP-1.4], quote: "The system generates the receipt"}
      - id: SP-1.5
        actor: system
        action: "sends a reminder after 3 days"
        duration: {value: 3, unit: days, param: P-reminder}
        terminal: true
        rules: [R-003]
        source: {page: 1, ids: [SP-1.5], quote: "The system sends a reminder after 3 days"}
      - id: SP-1.X1
        actor: system
        action: "shows an error and returns to SP-1.1"
        next: [SP-1.1]
        allow_loop: true
        source: {page: 1, ids: [SP-1.X1], quote: "the system shows an error and returns to step SP-1.1"}
  - id: SP-2
    name: Notification Process
    source: {doc: process_v1.pdf, pages: [2], ids: [SP-2]}
    actors: [system]
    steps:
      - id: SP-2.1
        actor: system
        action: "adds the notification to the queue"
        next: [SP-2.2]
        source: {page: 2, ids: [SP-2.1], quote: "The system adds the notification to the queue"}
      - id: SP-2.2
        actor: system
        action: "sends the notification"
        next: [SP-2.3]
        source: {page: 2, ids: [SP-2.2], quote: "The system sends the notification"}
      - id: SP-2.3
        actor: system
        action: "applies the reminder period of 3 days"
        duration: {value: 3, unit: days, param: P-reminder}
        rules: [R-003]
        source: {page: 2, ids: [SP-2.3], quote: "The reminder period must be 3 days"}
parameters:
  - {id: P-reminder, value: 3, unit: days, doc_unit: "days?", used_in: [SP-1.5, SP-2.3], source: {page: 1, ids: [SP-1.5, SP-2.3], quote: "3 days"}}
  - {id: P-approval, value: 2, unit: days, doc_unit: "days?", used_in: [SP-1.3], source: {page: 1, ids: [SP-1.3], quote: "within 2 days"}}
tbd: []
entities: []
